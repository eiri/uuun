[package]
name = "uuun"
version = "0.3.0"
edition = "2024"
description = "Moog-style 8-voices polyphonic software synthesizer"
repository = "https://github.com/eiri/uuun"
keywords = ["audio", "synthesizer", "midi", "dsp", "music"]
categories = ["multimedia::audio"]
authors = ["Eric Avdey <eiri@eiri.ca>"]
license = "MIT"

[[bin]]
name = "uuun"
path = "src/main.rs"

[dependencies]
cpal = "0.18"
midir = "0.11"
serde = { version = "1", features = ["derive"] }
wmidi = "4"

[profile.release]
opt-level   = 3
lto         = "thin"
codegen-units = 1

[profile.dev]
opt-level   = 1 # enough for real-time audio even in dev builds
